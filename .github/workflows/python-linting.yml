# This workflow will lint python code with flake8.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron:  '30 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        uv sync --group lint
    - name: Check sorted python imports using isort
      run: |
        uv run isort . -c
    - name: Lint code with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # The GitHub editor is 127 chars wide.
        uv run flake8 . --count --max-complexity=30 --max-line-length=127 --statistics
        # Check for cyclometric complexity for specific files where this metric has been
        # reduced to ten and below
        uv run flake8 dice_ml/data_interfaces/ --count --max-complexity=10 --max-line-length=127
