[project]
name = "dice-ml"
version = "0.12"
description = "Generate Diverse Counterfactual Explanations for any machine learning model."
readme = "README.rst"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Ramaravind Mothilal, Amit Sharma, Chenhao Tan", email = "raam.arvind93@gmail.com" },
]
keywords = ["machine-learning", "explanation", "interpretability", "counterfactual"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "jsonschema",
    "numpy",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn",
    "tqdm",
    "raiutils>=0.4.0",
    "xgboost",
    "lightgbm",
]

[project.urls]
Homepage = "https://github.com/interpretml/DiCE"
Download = "https://github.com/interpretml/DiCE/archive/v0.12.tar.gz"

[project.optional-dependencies]
deeplearning = [
    "tensorflow>=1.13.1",
    "torch",
]

[dependency-groups]
test = [
    "ipython",
    "jupyter",
    "pytest",
    "pytest-cov",
    "twine",
    "pytest-mock",
    "rai-test-utils",
]
lint = [
    "flake8",
    "flake8-bugbear",
    "flake8-blind-except",
    "flake8-breakpoint",
    "flake8-builtins",
    "flake8-logging-format",
    "flake8-pytest-style",
    "flake8-all-not-strings",
    "isort",
    "packaging",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dice_ml"]

[tool.hatch.build.targets.sdist]
include = [
    "dice_ml/",
    "tests/",
    "docs/",
    "LICENSE",
    "CODEOWNERS",
    "README.rst",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "notebook_tests: marks tests as notebook tests",
    "advanced: marks tests as advanced",
]

[tool.isort]
profile = "black"
